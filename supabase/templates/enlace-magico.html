<!doctype html>
<html lang="es">
<body style="margin:0;padding:24px;background:#fbf7f0;font-family:Arial,Helvetica,sans-serif;color:#1f2a24">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:16px;padding:28px;border:1px solid #cfe0d5">
    <h1 style="margin:0 0 12px;font-size:22px;color:#244a3b">Tu enlace de acceso</h1>
    <p style="margin:0 0 20px;font-size:16px;line-height:1.5">Recibimos una solicitud para entrar al panel de administración de {{ .SiteURL }}. Presiona el botón para continuar:</p>
    <!-- El enlace abre una página de confirmación (no inicia sesión directamente): así los filtros de seguridad de algunos correos, que abren los enlaces para revisarlos, no gastan el enlace antes que la persona. -->
    <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/admin/confirmar?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:14px 24px;border-radius:999px;background:#2f5d4a;color:#ffffff;font-weight:bold;font-size:17px;text-decoration:none">Entrar al panel</a></p>
    <p style="margin:0;font-size:14px;line-height:1.5;color:#4a5750">El enlace vence en 15 minutos y sirve una sola vez. Si no solicitaste este acceso, ignora este correo: tu cuenta sigue protegida.</p>
  </div>
</body>
</html>
