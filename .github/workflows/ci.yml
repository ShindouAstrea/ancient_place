name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint y typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Instala la versión de pnpm indicada en "packageManager" (package.json).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Solo verifica que la imagen compile. NO se publica en ningún registro.
      # Las NEXT_PUBLIC_* son valores ficticios: esta imagen no se despliega.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: hogar-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://ejemplo.cl
            NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-placeholder
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
